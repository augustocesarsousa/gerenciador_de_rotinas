<div class="p-4 max-w-screen overflow-x-hidden">
  <h1 class="text-xl font-bold mb-4">Consulta de usuários</h1>
  <!-- Form -->
  <form
    [formGroup]="searchForm"
    (ngSubmit)="getAllUsers()"
    class="grid grid-cols-1 gap-4 lg:grid-cols-5"
  >
    <mat-form-field appearance="outline">
      <mat-label>Id</mat-label>
      <input matInput type="number" formControlName="id" />
    </mat-form-field>
    <mat-form-field appearance="outline" class="lg:col-span-2">
      <mat-label>Nome</mat-label>
      <input matInput type="text" formControlName="name" />
    </mat-form-field>
    <mat-form-field appearance="outline" class="lg:col-span-2">
      <mat-label>Login</mat-label>
      <input matInput type="text" formControlName="login" />
    </mat-form-field>
    <mat-form-field appearance="outline" class="lg:col-span-2">
      <mat-label>E-mail</mat-label>
      <input matInput type="email" formControlName="email" />
    </mat-form-field>
    <mat-form-field appearance="outline">
      <mat-label>Status</mat-label>
      <mat-select formControlName="status">
        <mat-option value="">Selecionar...</mat-option>
        @for (status of userStatus; track status.index) {
          <mat-option [value]="status.value">
            {{ status.description }}
          </mat-option>
        }
      </mat-select>
    </mat-form-field>
    <div class="lg:col-span-2 lg:pt-2 flex items-start gap-2">
      <button
        mat-flat-button
        type="submit"
        class="w-full h-full bg-blue-600 text-white shadow-md hover:bg-blue-700 hover:shadow-lg transition duration-200 ease-in-out"
      >
        <mat-icon>search</mat-icon>
        Pesquisar
      </button>
      <button
        mat-flat-button
        [routerLink]="['/users/create']"
        class="w-full h-full bg-green-700! text-white! shadow-md! hover:bg-green-900! hover:shadow-lg! transition duration-200 ease-in-out"
      >
        <mat-icon>person_add</mat-icon>
        Cadastrar
      </button>
    </div>
  </form>
  <!-- Table -->
  <div class="mt-6 w-full overflow-x-auto">
    <table mat-table [dataSource]="usersTable" matSort class="min-w-300 w-full">
      <ng-container matColumnDef="id">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Id</th>
        <td mat-cell *matCellDef="let user">{{ user.id }}</td>
      </ng-container>
      <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Nome</th>
        <td mat-cell *matCellDef="let user">{{ user.name }}</td>
      </ng-container>
      <ng-container matColumnDef="login">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Login</th>
        <td mat-cell *matCellDef="let user">{{ user.login }}</td>
      </ng-container>
      <ng-container matColumnDef="email">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>E-mail</th>
        <td mat-cell *matCellDef="let user">{{ user.email }}</td>
      </ng-container>
      <ng-container matColumnDef="status">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Status</th>
        <td mat-cell *matCellDef="let user">
          {{ user.status | user_status }}
        </td>
      </ng-container>
      <ng-container matColumnDef="editar">
        <th mat-header-cell *matHeaderCellDef></th>
        <td mat-cell *matCellDef="let user">
          <button mat-button color="accent" [routerLink]="['/users/edit', user.id]">
            <mat-icon>edit</mat-icon>Editar
          </button>
        </td>
      </ng-container>
      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr
        mat-row
        *matRowDef="let row; columns: displayedColumns"
        [ngClass]="{ 'bg-red-100! text-red-600!': row.status === 'INACTIVE' }"
      ></tr>
    </table>
    <!-- Pagination -->
    <div class="w-full min-w-150">
      <mat-paginator
        [length]="totalElements"
        [pageSize]="pageSize"
        [pageIndex]="pageIndex"
        [pageSizeOptions]="[10, 20, 50]"
        (page)="onPageChange($event)"
      ></mat-paginator>
    </div>
  </div>
</div>
