<div class="p-4 max-w-screen overflow-x-hidden">
  <h1 class="text-xl font-bold mb-4 text-slate-800">Consulta de instituições bancárias</h1>

  <!-- Form -->
  <form
    [formGroup]="searchForm"
    (ngSubmit)="getAllBanks()"
    class="grid grid-cols-1 gap-4 lg:grid-cols-6"
  >
    <mat-form-field appearance="outline">
      <mat-label>Código</mat-label>
      <input matInput type="text" formControlName="code" />
    </mat-form-field>

    <mat-form-field appearance="outline" class="lg:col-span-2">
      <mat-label>Razão Social</mat-label>
      <input matInput type="text" formControlName="name" />
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Nome Fantasia</mat-label>
      <input matInput type="text" formControlName="shortName" />
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>ISPB</mat-label>
      <input matInput type="text" formControlName="ispb" />
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Status</mat-label>
      <mat-select formControlName="status">
        <mat-option value="">Selecionar...</mat-option>
        <mat-option value="ACTIVE">Ativo</mat-option>
        <mat-option value="INACTIVE">Inativo</mat-option>
      </mat-select>
    </mat-form-field>

    <div class="lg:col-span-2 lg:pt-2 flex items-start gap-2">
      <button
        mat-flat-button
        type="submit"
        class="w-full h-full bg-blue-600 text-white shadow-md hover:bg-blue-700 hover:shadow-lg transition duration-200 ease-in-out"
      >
        <mat-icon>search</mat-icon>
        Pesquisar
      </button>
      <button
        mat-flat-button
        type="button"
        [routerLink]="['/financeiro/cadastros/bancos/novo']"
        class="w-full h-full bg-green-700! text-white! shadow-md! hover:bg-green-900! hover:shadow-lg! transition duration-200 ease-in-out"
      >
        <mat-icon>add</mat-icon>
        Cadastrar
      </button>
    </div>
  </form>

  <!-- Table -->
  <div class="mt-6 w-full overflow-x-auto">
    <table mat-table [dataSource]="banks()" class="min-w-300 w-full">
      <!-- Código COMPE -->
      <ng-container matColumnDef="code">
        <th mat-header-cell *matHeaderCellDef>Código</th>
        <td mat-cell *matCellDef="let bank">{{ bank.code }}</td>
      </ng-container>

      <!-- Nome Fantasia -->
      <ng-container matColumnDef="shortName">
        <th mat-header-cell *matHeaderCellDef>Nome Fantasia</th>
        <td mat-cell *matCellDef="let bank">{{ bank.shortName }}</td>
      </ng-container>

      <!-- Razão Social -->
      <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef>Razão Social</th>
        <td mat-cell *matCellDef="let bank">{{ bank.name }}</td>
      </ng-container>

      <!-- ISPB -->
      <ng-container matColumnDef="ispb">
        <th mat-header-cell *matHeaderCellDef>ISPB</th>
        <td mat-cell *matCellDef="let bank">{{ bank.ispb || '-' }}</td>
      </ng-container>

      <!-- Status -->
      <ng-container matColumnDef="status">
        <th mat-header-cell *matHeaderCellDef>Status</th>
        <td mat-cell *matCellDef="let bank">
          @if (bank.status === 'ACTIVE') {
            Ativo
          } @else {
            Inativo
          }
        </td>
      </ng-container>

      <!-- Editar -->
      <ng-container matColumnDef="editar">
        <th mat-header-cell *matHeaderCellDef></th>
        <td mat-cell *matCellDef="let bank">
          <button mat-button color="accent" [routerLink]="['/financeiro/cadastros/bancos/editar', bank.id]">
            <mat-icon>edit</mat-icon>Editar
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr
        mat-row
        *matRowDef="let row; columns: displayedColumns"
        [ngClass]="{ 'bg-red-100! text-red-600!': row.status === 'INACTIVE' }"
      ></tr>
    </table>

    <!-- Pagination -->
    <div class="w-full min-w-150">
      <mat-paginator
        [length]="totalElements()"
        [pageSize]="pageSize()"
        [pageIndex]="pageIndex()"
        [pageSizeOptions]="[10, 20, 50]"
        (page)="onPageChange($event)"
      ></mat-paginator>
    </div>
  </div>
</div>
